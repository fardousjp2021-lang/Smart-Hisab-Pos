<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Offline — Glorious IT POS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font: 15px/1.5 system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 1.5rem; }
      .card { max-width: 28rem; width: 100%; text-align: center; padding: 2rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { color: #94a3b8; margin: 0 0 1.5rem; }
      button { padding: 0.6rem 1.25rem; border-radius: 0.5rem; font: inherit; cursor: pointer; border: 0; background: #2563eb; color: #fff; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>No internet connection detected. Cached pages remain available; live data will resume once you reconnect.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
