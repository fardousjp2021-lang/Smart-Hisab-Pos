<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/smarthisab_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartHisab POS — Cloud Business POS Software</title>
  </head>
  <body style="margin: 0; background: #0f172a;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 74px; height: 74px; border-radius: 20px; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5); margin-bottom: 20px; padding: 6px; box-sizing: border-box;">
          <img src="/smarthisab_icon.png" alt="SmartHisab" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
        <h1 style="font-size: 22px; font-weight: 800; margin: 0 0 8px 0; letter-spacing: -0.5px; color: #ffffff;">SmartHisab POS</h1>
        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 22px 0; font-weight: 500;">ব্যবসা ও ইনভেন্টরি ম্যানেজমেন্ট সিস্টেম লোড হচ্ছে...</p>
        <div style="width: 180px; height: 4px; background: #334155; border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 45%; height: 100%; background: linear-gradient(90deg, #3b82f6, #10b981); border-radius: 9999px; animation: smarthitsab-bar 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes smarthitsab-bar {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(120%); }
            100% { transform: translateX(350%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
